<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万界文明 · 草地 LOD 与六边铺设测试</title><style>
*{box-sizing:border-box}body{margin:0;background:#171c20;color:#ebecdf;font:14px system-ui,Segoe UI,sans-serif}header{padding:12px 18px;border-bottom:1px solid #3a3d3a}header strong{font-size:17px}main{display:flex;height:calc(100vh - 55px)}#view{flex:1;min-width:0}aside{width:310px;background:#20262a;border-left:1px solid #454949;padding:20px;overflow:auto}label{display:block;margin:18px 0 7px;color:#bfc3b5}select,input,button{width:100%;padding:8px;background:#323b3e;color:white;border:1px solid #59625c;border-radius:6px}input[type=range]{padding:0}small{color:#b7bfb5}#status{white-space:pre-wrap;line-height:1.6;color:#a9c9a9}.stat{margin-top:18px;padding:10px;background:#303638;border-radius:8px}button{cursor:pointer;margin-top:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<header><strong>万界文明 · 草地资产实际铺设测试</strong>　<small>独立草地 + 石质底盘 ｜ 摄像机 LOD ｜ 19 格密铺</small></header><main><div id="view"></div><aside>
<label>铺设规模</label><select id="count"><option value="1">单块检查</option><option value="19">19 块密铺检查</option></select>
<label>精度选择</label><select id="lod"><option value="auto">自动（按屏幕大小）</option><option value="85">LOD1 / 40,981 面</option><option value="40">LOD2 / 9,249 面</option><option value="22">LOD3 / 2,715 面</option><option value="10">LOD4 / 730 面</option></select>
<label><input type="checkbox" id="base" checked style="width:auto"> 显示石质底盘</label>
<label>草地高度偏移：<span id="offsetVal">0.200</span></label><input id="offset" type="range" min="-0.03" max="0.33" step="0.005" value="0.20">
<label>相邻地块间隔：<span id="gapVal">0.00</span></label><input id="gap" type="range" min="-0.08" max="0.1" step="0.005" value="0">
<button id="reset">重置镜头</button><div class="stat" id="status">正在加载模型……</div><p><small>鼠标左键旋转，中键/右键平移，滚轮缩放。这里检测的是几何、纹理和铺设外观；实际游戏性能还需在引擎里测试。</small></p></aside></main>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),mount=$('view'),scene=new THREE.Scene();scene.background=new THREE.Color('#242b2e');scene.add(new THREE.HemisphereLight(0xffffff,0x68717a,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(4,8,6);scene.add(sun);
const camera=new THREE.PerspectiveCamera(42,1,.05,250);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;mount.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,0,0);
const root=new THREE.Group();scene.add(root);const models={};const loader=new GLTFLoader();async function load(url){return(await loader.loadAsync(url)).scene}
const coords=[[0,0]];for(let ring=1;ring<=2;ring++){for(let q=-ring;q<=ring;q++)for(let r=-ring;r<=ring;r++){const s=-q-r;if(Math.max(Math.abs(q),Math.abs(r),Math.abs(s))===ring)coords.push([q,r])}}
function targetLOD(){if($('lod').value!=='auto')return $('lod').value;const distance=camera.position.distanceTo(orbit.target);return distance<3.8?'85':distance<7?'40':distance<13?'22':'10'}
let last='';function rebuild(){if(!models.base)return;const lvl=targetLOD(), key=[$('count').value,lvl,$('base').checked,$('offset').value,$('gap').value].join('|');if(key===last)return;last=key;root.clear();const total=Number($('count').value),gap=Number($('gap').value),spacing=1+gap;let faces=0;for(const [q,r] of coords.slice(0,total)){const pos=new THREE.Vector3((1.899*0.75*q)*spacing,0,(1.656*(r+q/2))*spacing);if($('base').checked){const b=models.base.clone();b.position.copy(pos);root.add(b);faces+=340514;}const m=models[lvl].clone();m.position.copy(pos);m.position.y+=Number($('offset').value);root.add(m);faces+=({85:40981,40:9249,22:2715,10:730})[lvl]}$('status').textContent=`模型 LOD：${lvl}\n实例数：${total}\n渲染三角面（不含地表内细节变化）：${faces.toLocaleString()}\n底盘每块：340,514 面（当前仍是高模）\n提示：相邻接缝和重复纹理请在 19 格视图检查。`}
function reset(){const many=$('count').value==='19';camera.position.set(many?10:3.8,many?12:5.5,many?13:6.6);orbit.target.set(0,0,0);orbit.update();last='';rebuild()}
for(const key of ['count','lod','base','offset','gap'])$(key).addEventListener('input',()=>{ $('offsetVal').textContent=Number($('offset').value).toFixed(3);$('gapVal').textContent=Number($('gap').value).toFixed(3);last='';if(key==='count')reset();rebuild()});$('reset').onclick=reset;
try{models.base=await load('assets/base.glb');for(const n of ['85','40','22','10'])models[n]=await load('assets/lod'+n+'.glb');reset();$('status').textContent+='\n加载成功。';}catch(e){$('status').textContent='模型加载失败：'+e.message+'\n请检查 assets 文件夹是否包含全部五个 GLB。\n需联网加载 Three.js，并通过本地 HTTP 服务打开。'}
function frame(){requestAnimationFrame(frame);orbit.update();if($('lod').value==='auto')rebuild();let w=mount.clientWidth,h=mount.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.render(scene,camera)}frame();
</script></body></html>
