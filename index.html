<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万界文明 · 卡牌世界实验</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./game.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body class="game-mode">
<div id="viewport"></div>
<header><div class="kicker">WANJIE CIVILIZATION / PLAYABLE MECHANICS</div><h1>万界文明</h1><p>卡牌 × 世界规则 · 可交互实验</p><a class="editor-link" href="./editor.html">打开地形编辑器 ↗</a></header>
<aside class="game-panel">
 <div class="label">世界状态 <strong id="turn">第 0 次结算</strong></div>
 <p class="game-description">选择卡牌，再点击棋盘地块。预览不会消耗卡牌或改变世界。</p>
 <div class="divider"></div><div class="label">选中地块</div><p id="selected">点击地图查看地块</p>
 <div class="divider"></div><div class="label">结算预览</div><p id="preview" aria-live="polite">选择一张牌，然后点击目标地块。</p>
 <div class="buttons"><button id="confirm" disabled>确认出牌</button><button id="cancel">取消选择</button></div>
 <div class="divider"></div><div class="label">事件反馈</div><p id="notice" aria-live="polite">世界已准备就绪。</p>
 <div class="divider"></div><div class="label">视角</div><div class="buttons"><button data-angle="55" class="on">55°</button><button data-angle="70">70°</button><button data-angle="85">85°</button></div>
</aside>
<section id="hand" aria-label="实验卡牌"><div class="hand-heading"><strong>实验手牌</strong><span>两张演示牌 · 可重复使用（非正式卡牌经济）</span></div><div class="hand-cards"><button class="game-card" data-card="spark"><strong>火种</strong><span>热量 +55</span><small>干燥环境可能点燃燃料</small></button><button class="game-card" data-card="rain"><strong>降雨</strong><span>湿度 +45</span><small>潮湿环境可能抑制火势</small></button></div></section>
<div class="footer">左键：选择地块　｜　右键拖动：平移　｜　滚轮：缩放　｜　Esc：取消　｜　当前为方格规则实验，六角棋盘尚未集成</div>
<script type="module" src="./src/game-main.js"></script></body></html>
